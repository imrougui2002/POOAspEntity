name: Build P8Maui

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Installer la charge de travail MAUI
        run: dotnet workload install maui

      - name: Compiler P8Maui (Windows)
        run: dotnet build P8Maui/P8Maui.csproj -f net10.0-windows10.0.19041.0 -c Release
